# Optional NVIDIA GPU overlay only (nvidia-smi).
# Linux / Windows (WSL2 + NVIDIA Container Toolkit):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml
# AMD Radeon on Windows: do NOT use Hub ollama/ollama:rocm (that is Linux).
# Stop the Docker ollama container and install native Ollama from https://ollama.com/download
# Keep Open WebUI in Docker; it already talks to http://host.docker.internal:11434 after that.

services:
  ollama:
    gpus: all
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OLLAMA_FLASH_ATTENTION=1
